clouds:
  norstec-exposed:

    auth_type: v3applicationcredential
    auth:
      auth_url: "${OS_NTNU_AUTH_URL}"
      application_credential_id: "${NORSTEC_EXPOSED_APP_CRED_ID}"
      application_credential_secret: "${NORSTEC_EXPOSED_APP_CRED_SECRET}"

    region_name: "${NORSTEC_EXPOSED_REGION}"
    interface: 
    identity_api_version: 3

  norstec-internal:

    auth_type: v3applicationcredential
    auth:
      auth_url: "${OS_NTNU_AUTH_URL}"
      application_credential_id: "${NORSTEC_INTERNAL_APP_CRED_ID}"
      application_credential_secret: "${NORSTEC_INTERNAL_APP_CRED_SECRET}"

    region_name: "${NORSTEC_INTERNAL_REGION}"
    interface: 
    identity_api_version: 3

  norstec-internal:

    auth_type: v3applicationcredential
    auth:
      auth_url: "${OS_NTNU_AUTH_URL}"
      application_credential_id: "${NORSTEC_BACKUP_APP_CRED_ID}"
      application_credential_secret: "${NORSTEC_BACKUP_APP_CRED_SECRET}"

    region_name: "${NORSTEC_BACKUP_REGION}"
    interface: 
    identity_api_version: 3
